name: Publish River of Life redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-redesign:
    if: "!contains(github.event.head_commit.message, '[redesign-publish]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject responsive redesign stylesheets into GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          target="docs/index.html"
          marker='responsive.css?v=61_ROL_RESPONSIVE'
          if grep -q "$marker" "$target"; then
            echo "Responsive redesign already injected."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          redesign = '<link rel="stylesheet" href="redesign.css?v=60_ROL_PREMIUM">'
          responsive = '<link rel="stylesheet" href="responsive.css?v=61_ROL_RESPONSIVE">'
          if redesign not in s:
              raise SystemExit('Existing redesign stylesheet tag not found; refusing to modify index.html')
          s = s.replace(redesign, redesign + '\n  ' + responsive, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit published page change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish River of Life responsive layout [redesign-publish]'
          git push
