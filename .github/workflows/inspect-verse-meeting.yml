name: Apply River of Life fixes
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 scripts/apply_fixes.py
      - name: Commit fixes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html android-studio-app/app/src/main/assets/index.html android-studio-app/app/build/intermediates/assets/debug/mergeDebugAssets/app.js
          git commit -m 'fix: keep meetings in app and center daily verse sharing' || true
          git rm .github/workflows/inspect-verse-meeting.yml
          git commit -m 'chore: remove temporary fix workflow' || true
          git push
