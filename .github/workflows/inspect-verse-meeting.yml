name: Apply River of Life fixes
on:
  push:
    paths:
      - '.github/workflows/inspect-verse-meeting.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch meeting and daily verse
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Remove the Read action so Daily Bible Verse keeps only Download and Share.
          for p in [Path('index.html'), Path('android-studio-app/app/src/main/assets/index.html')]:
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s2 = re.sub(r'\s*<button class="home-vod-btn" id="home-vod-btn-read".*?</button>', '', s, count=1, flags=re.S)
                  s2 = s2.replace('Read, Listen, Save, Share', 'Download, Share')
                  s2 = s2.replace('Simple Icons Only: Read, Listen, Save, Share', 'Simple Icons Only: Download, Share')
                  s2 = s2.replace('v2341_IOS_JITSI_TOP_LEVEL_MIC_FIX', 'v2342_IN_APP_MIC_DAILY_VERSE_FIX')
                  s2 = s2.replace('165_MARATHI_VERSE_MIC_SAFARI_FIX', '167_IN_APP_MIC_DAILY_VERSE_FIX')
                  if s2 != s:
                      p.write_text(s2, encoding='utf-8')

          # Keep Jitsi embedded on iOS: never send users to Safari.
          embedded_join = '''function proceedJoinMeetingInApp() {
            if (typeof closeModal === "function") closeModal("modal-ios-meeting-choice");
            else {
              const el = document.getElementById("modal-ios-meeting-choice");
              if (el) el.style.display = "none";
            }
            const m = _pendingMeetingToJoin || { id: "default", title: "Live Fellowship" };
            showToast("Joining Live Sanctuary 🙏");
            launchLiveMeetingRoom(m, null);
          }
          window.proceedJoinMeetingInApp = proceedJoinMeetingInApp;'''

          meeting_code = '''
          
          /* River of Life: force the meeting to stay inside the app on iOS. */
          (function() {
            const isIOSDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIOSDevice || window.__rolInAppMeetingPatch) return;
            window.__rolInAppMeetingPatch = true;
            const originalTrigger = window.triggerJoinMeetingFlow;
            if (typeof originalTrigger === 'function') {
              window.triggerJoinMeetingFlow = function(meetingId) {
                originalTrigger(meetingId);
                setTimeout(function() {
                  try { proceedJoinMeetingInApp(); } catch (e) { console.warn('RoL iOS in-app join:', e); }
                }, 0);
              };
            }
            const hideChoice = function() {
              const el = document.getElementById('modal-ios-meeting-choice');
              if (el) el.style.display = 'none';
            };
            hideChoice();
            new MutationObserver(hideChoice).observe(document.documentElement, {childList:true, subtree:true});
          })();

          /* River of Life: make embedded Jitsi microphone permission explicit and
             recover from an initial muted state without blindly toggling an already-live mic. */
          (function() {
            if (window.__rolJitsiMicPatch) return;
            window.__rolJitsiMicPatch = true;
            const allowJitsiMic = function() {
              document.querySelectorAll('iframe').forEach(function(frame) {
                if (frame.src && /jitsi/i.test(frame.src)) {
                  frame.setAttribute('allow', 'camera; microphone; autoplay; fullscreen; display-capture');
                  frame.setAttribute('allowfullscreen', 'true');
                }
              });
            };
            allowJitsiMic();
            new MutationObserver(allowJitsiMic).observe(document.documentElement, {childList:true, subtree:true});
          })();
          '''

          def patch_app(path):
              p = Path(path)
              if not p.exists(): return
              s = p.read_text(encoding='utf-8')
              # Restore the embedded implementation from the prior Safari workaround.
              s2, n = re.subn(r'function proceedJoinMeetingInApp\(\)\s*\{.*?\n\}\s*window\.proceedJoinMeetingInApp\s*=\s*proceedJoinMeetingInApp;', embedded_join, s, count=1, flags=re.S)
              if n == 0:
                  # If already patched, do not duplicate the function.
                  s2 = s

              # Force the joined participant's audio on only when Jitsi reports it muted.
              mic_bootstrap = '''api.on("videoConferenceJoined", function() {
                try {
                  const jf = api.getIFrame && api.getIFrame();
                  if (jf) {
                    jf.setAttribute("allow", "camera; microphone; autoplay; fullscreen; display-capture");
                    jf.setAttribute("allowfullscreen", "true");
                  }
                  const ensureMicOn = function() {
                    api.isAudioMuted().then(function(muted) {
                      if (muted) api.executeCommand("toggleAudio");
                    }).catch(function() {});
                  };
                  ensureMicOn();
                  setTimeout(ensureMicOn, 350);
                  setTimeout(ensureMicOn, 1000);
                  setTimeout(ensureMicOn, 2000);
                } catch (e) { console.warn("RoL microphone startup:", e); }
              });'''
              s2 = re.sub(r'api\.on\("videoConferenceJoined", function\(\) \{', mic_bootstrap, s2, count=1)
              # Do not offer the external Safari meeting URL anymore.
              s2 = re.sub(r'const extUrl = `https://\$\{jitsiServerDomain\}/\$\{roomSlug\}#config\.disableDeepLinking=true&config\.startWithAudioMuted=false&config\.startAudioMuted=9999&config\.prejoinPageEnabled=false&userInfo\.displayName=\$\{encodeURIComponent\(loggedIn\)\}`;', '', s2)
              s2 = s2.replace('v2341_IOS_JITSI_TOP_LEVEL_MIC_FIX', 'v2342_IN_APP_MIC_DAILY_VERSE_FIX')
              # Append a deterministic, centered daily-verse image generator/share implementation.
              if 'RoL centered Daily Verse share patch' not in s2:
                  s2 += r'''

/* RoL centered Daily Verse share patch */
(function() {
  function getDailyVerseMeta() {
    const textEl = document.getElementById('home-vod-text');
    const refEl = document.getElementById('home-vod-ref');
    return {
      text: textEl ? textEl.textContent.replace(/[“”]/g, '').trim() : '',
      ref: refEl ? refEl.textContent.trim() : 'River of Life'
    };
  }
  function loadImage(src) {
    return new Promise(function(resolve, reject) {
      const img = new Image();
      img.onload = function() { resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }
  async function buildDailyVerseImage() {
    const meta = getDailyVerseMeta();
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1080;
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('card-daily-verse-home');
    let bg = '';
    if (card) {
      const m = getComputedStyle(card).backgroundImage.match(/url\(["']?(.*?)["']?\)/);
      if (m) bg = m[1];
    }
    try {
      if (bg) {
        const img = await loadImage(new URL(bg, location.href).href);
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (1080-w)/2, (1080-h)/2, w, h);
      } else {
        ctx.fillStyle = '#18243a'; ctx.fillRect(0,0,1080,1080);
      }
    } catch (e) {
      ctx.fillStyle = '#18243a'; ctx.fillRect(0,0,1080,1080);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fillRect(0,0,1080,1080);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 34px Georgia, serif';
    const maxWidth = 820, lineHeight = 54;
    const words = meta.text.split(/\s+/); let line = ''; const lines = [];
    words.forEach(function(word) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
      else line = test;
    });
    if (line) lines.push(line);
    const startY = 500 - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach(function(l, i) { ctx.fillText(l, 540, startY + i * lineHeight); });
    ctx.font = '700 25px Arial, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(meta.ref, 540, Math.min(900, startY + lines.length * lineHeight + 70));
    return { canvas: canvas, dataUrl: canvas.toDataURL('image/png'), meta: meta };
  }
  window.saveExactDailyVerseImage = async function() {
    try {
      const result = await buildDailyVerseImage();
      const a = document.createElement('a');
      a.href = result.dataUrl;
      a.download = 'river-of-life-daily-verse.png';
      document.body.appendChild(a); a.click(); a.remove();
      if (typeof showToast === 'function') showToast('Daily verse image ready to save 🙏');
    } catch (e) { if (typeof showToast === 'function') showToast('Unable to create verse image'); }
  };
  window.shareDailyVerseToWhatsApp = async function() {
    try {
      const result = await buildDailyVerseImage();
      const blob = await new Promise(function(resolve) { result.canvas.toBlob(resolve, 'image/png'); });
      const file = new File([blob], 'river-of-life-daily-verse.png', {type:'image/png'});
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share({ files:[file], text: result.meta.text + '\n\n' + result.meta.ref });
      } else {
        const msg = encodeURIComponent(result.meta.text + '\n\n' + result.meta.ref);
        window.open('https://wa.me/?text=' + msg, '_blank');
      }
    } catch (e) { if (e && e.name !== 'AbortError' && typeof showToast === 'function') showToast('Sharing cancelled or unavailable'); }
  };
})();
'''
              p.write_text(s2, encoding='utf-8')

          for path in ['app.js', 'android-studio-app/app/build/intermediates/assets/debug/mergeDebugAssets/app.js']:
              patch_app(path)

          # Hide the obsolete iOS Safari choice even if an old cached function creates it.
          for p in [Path('index.html'), Path('android-studio-app/app/src/main/assets/index.html')]:
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  marker = '<style id="rol-in-app-meeting-fix">#modal-ios-meeting-choice{display:none!important}</style>'
                  if marker not in s:
                      s = s.replace('</head>', marker + '</head>', 1)
                  p.write_text(s, encoding='utf-8')

          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html android-studio-app/app/src/main/assets/index.html android-studio-app/app/build/intermediates/assets/debug/mergeDebugAssets/app.js
          git commit -m 'fix: keep meetings in app and center daily verse sharing'
          git rm .github/workflows/inspect-verse-meeting.yml
          git commit -m 'chore: remove temporary fix workflow'
          git push
