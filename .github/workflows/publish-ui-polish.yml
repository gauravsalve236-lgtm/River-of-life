name: Publish River of Life UI polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-ui-polish:
    if: "!contains(github.event.head_commit.message, '[ui-polish-publish]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI polish assets
        shell: bash
        run: |
          set -euo pipefail
          target="docs/index.html"
          css_marker='ui-polish.css?v=63_ROL_UI_POLISH'
          js_marker='ui-polish.js?v=63_ROL_UI_POLISH'

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          css_marker = 'ui-polish.css?v=63_ROL_UI_POLISH'
          js_marker = 'ui-polish.js?v=63_ROL_UI_POLISH'

          css = '<link rel="stylesheet" href="ui-polish.css?v=63_ROL_UI_POLISH">'
          js = '<script src="ui-polish.js?v=63_ROL_UI_POLISH"></script>'

          if css_marker not in s:
              anchor = '<link rel="stylesheet" href="responsive-fix.css?v=62_ROL_DESKTOP_FIX">'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n  ' + css, 1)
              else:
                  anchor2 = '<link rel="stylesheet" href="responsive.css?v=61_ROL_RESPONSIVE">'
                  if anchor2 not in s:
                      raise SystemExit('Responsive stylesheet anchor not found')
                  s = s.replace(anchor2, anchor2 + '\n  ' + css, 1)

          if js_marker not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing body end tag')
              s = s.replace('</body>', '  ' + js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if git diff --cached --quiet; then
            echo 'No UI polish changes needed.'
            exit 0
          fi
          git commit -m 'Publish River of Life UI polish [ui-polish-publish]'
          git push
