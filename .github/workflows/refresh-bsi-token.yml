name: Refresh BSI Audio Token

on:
  schedule:
    # Run every 30 minutes to guarantee BSI audio never expires
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Verify Live BSI Token
        run: python scripts/refresh_bsi_token.py

      - name: Commit and Push Updated Token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bsi_token.json docs/assets/bsi_token.json app.js docs/app.js .bsi_token.json
          git diff --staged --quiet || (git commit -m "chore(audio): auto-refresh BSI CloudFront token [skip ci]" && git push)
