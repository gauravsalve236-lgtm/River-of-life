name: Run Daily Verse Centering Fix
on:
  push:
    paths:
      - '.github/workflows/run-daily-verse-fix.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          marker='/* DAILY_VERSE_CENTER_FIX_V2 */'
          if marker not in s:
              patch=r'''\n\n/* DAILY_VERSE_CENTER_FIX_V2 */\n(function(){\n  const W=1080,H=1080;\n  function wrap(ctx,text,max){const words=String(text||'').trim().split(/\\s+/),out=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width<=max||!line)line=t;else{out.push(line);line=w;}}if(line)out.push(line);return out;}\n  async function img(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src;});}\n  async function build(){\n    const card=document.getElementById('card-daily-verse-home');\n    const verseEl=card?.querySelector('.home-vod-text, .daily-verse-text, [class*=verse-text]');\n    const refEl=card?.querySelector('.home-vod-reference, .daily-verse-reference, [class*=reference]');\n    const verse=(verseEl?.innerText||card?.dataset?.verse||'').trim();\n    const ref=(refEl?.innerText||card?.dataset?.reference||'').trim();\n    if(!verse)throw new Error('Daily verse text not found');\n    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');\n    const bg=card?.querySelector('img');\n    if(bg?.src){try{const i=await img(bg.src),sc=Math.max(W/i.width,H/i.height),iw=i.width*sc,ih=i.height*sc;x.drawImage(i,(W-iw)/2,(H-ih)/2,iw,ih);}catch(e){x.fillStyle='#111';x.fillRect(0,0,W,H);}}else{x.fillStyle='#111';x.fillRect(0,0,W,H);}\n    x.fillStyle='rgba(0,0,0,.20)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='600 48px Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';\n    const lines=wrap(x,verse,760),lh=68,refGap=52,refH=42,total=lines.length*lh+(ref?refGap+refH:0);let y=(H-total)/2+lh/2;\n    for(const line of lines){x.fillText(line,W/2,y);y+=lh;}\n    if(ref){x.font='700 32px Arial,sans-serif';x.fillText(ref,W/2,y+refGap-lh/2+refH/2);}\n    return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('PNG failed')),'image/png',1));\n  }\n  window.saveExactDailyVerseImage=async()=>{try{const b=await build(),f=new File([b],'daily-bible-verse.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'Daily Bible Verse'});else{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='daily-bible-verse.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}}catch(e){console.error('[Daily Verse]',e);}};\n  window.shareDailyVerseToWhatsApp=async()=>{try{const b=await build(),f=new File([b],'daily-bible-verse.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'Daily Bible Verse'});return;}window.open('https://wa.me/?text='+encodeURIComponent('Daily Bible Verse'),'_blank');}catch(e){console.error('[Daily Verse WhatsApp]',e);}};\n})();\n'''
              p.write_text(s+patch,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8').replace('v2343_IN_APP_MIC_DAILY_VERSE_FIX','v2344_DAILY_VERSE_CENTER_FIX')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --quiet || git commit -m 'fix: center daily bible verse share image'
          rm -f .github/workflows/run-daily-verse-fix.yml .github/workflows/fix-daily-verse-center.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary daily verse fix workflows'
          git push