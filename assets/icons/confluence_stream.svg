<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 3D Metallic Silver Chrome Gradient -->
    <linearGradient id="metalStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="streamHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Branch Stream -->
  <path d="M 22 18 C 30 38 42 50 45 78 L 37 78 C 34 52 22 42 14 20 Z" fill="url(#metalStream)" filter="url(#metalShadow)" />

  <!-- Right Branch Stream -->
  <path d="M 78 18 C 70 38 58 50 55 78 L 63 78 C 66 52 78 42 86 20 Z" fill="url(#metalStream)" filter="url(#metalShadow)" />

  <!-- Central Confluence Main Channel (Lower Body) -->
  <path d="M 37 78 L 45 78 L 50 78 L 55 78 L 63 78 C 63 85 64 92 65 94 L 35 94 C 36 92 37 85 37 78 Z" fill="url(#metalStream)" filter="url(#metalShadow)" />

  <!-- Center Joint Intersection Shimmer -->
  <path d="M 45 58 Q 50 52 55 58 L 54 86 Q 50 88 46 86 Z" fill="url(#streamHighlight)" opacity="0.6" />

  <!-- Left Highlight Ridge -->
  <path d="M 18 19 C 26 40 38 50 41 80" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Right Highlight Ridge -->
  <path d="M 82 19 C 74 40 62 50 59 80" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
</svg>
