<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <!-- 3D Sun Sphere Shading -->
    <radialGradient id="sun3D" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <!-- Water Disk Gradient -->
    <linearGradient id="waterDisk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <!-- Ray Glow -->
    <linearGradient id="rayGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sun Rays (Dotted / Soft Bars) -->
  <g stroke="url(#rayGlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="12" x2="50" y2="19" />
    <line x1="28" y1="20" x2="33" y2="26" />
    <line x1="72" y1="20" x2="67" y2="26" />
    <line x1="14" y1="38" x2="21" y2="40" />
    <line x1="86" y1="38" x2="79" y2="40" />
  </g>

  <!-- 3D Rising Sun Semi-Sphere -->
  <path d="M 24 54 A 26 26 0 0 1 76 54 Z" fill="url(#sun3D)" filter="url(#softGlow)" />

  <!-- Water Reflection Ellipse Base -->
  <ellipse cx="50" cy="58" rx="34" ry="11" fill="url(#waterDisk)" />
  <ellipse cx="50" cy="62" rx="26" ry="7" fill="#0369a1" opacity="0.6" />
  <ellipse cx="50" cy="66" rx="18" ry="4" fill="#0284c7" opacity="0.5" />
  <ellipse cx="50" cy="69" rx="10" ry="2" fill="#38bdf8" opacity="0.7" />

  <!-- Highlights on Water -->
  <path d="M 36 57 Q 50 59 64 57" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 42 61 Q 50 62.5 58 61" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>
