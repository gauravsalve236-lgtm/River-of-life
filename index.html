<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River of Life - जीवन नदी बायबल</title>
    <style>
        :root {
          --primary-color: #2563eb;     /* Vibrant, inspiring royal blue */
          --primary-light: #eff6ff;     /* Soft icy blue tint */
          --accent-gold: #d97706;       /* Warm amber/gold accent */
          --text-main: #1e293b;         /* Deep charcoal for crisp reading */
          --text-muted: #64748b;        /* Soft slate gray for subtext */
          --bg-app: #f8fafc;            /* Clean light background canvas */
          --bg-card: #ffffff;           /* Pure white for cards */
          --border-light: #e2e8f0;      /* Subtle border line */
          --shadow-subtle: 0 4px 20px rgba(37, 99, 235, 0.05);
          --radius-card: 16px;
        }

        body {
          background-color: var(--bg-app);
          color: var(--text-main);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          margin: 0;
          padding: 0;
          padding-bottom: 90px; /* Space for bottom navigation */
        }

        .app-container {
          max-width: 600px;
          margin: 0 auto;
        }

        /* Header Styles */
        .brand-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 20px;
          background: var(--bg-card);
          border-bottom: 1px solid var(--border-light);
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .brand-info {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .brand-logo {
          width: 42px;
          height: 42px;
          object-fit: contain;
          border-radius: 10px;
          background: var(--primary-light);
          padding: 4px;
        }

        .brand-title h1 {
          font-size: 1.1rem;
          font-weight: 700;
          margin: 0;
          color: var(--text-main);
        }

        .brand-title p {
          font-size: 0.8rem;
          color: var(--text-muted);
          margin: 0;
        }

        .icon-btn {
          background: var(--primary-light);
          border: none;
          width: 38px;
          height: 38px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--primary-color);
          transition: background 0.2s;
        }

        .icon-btn:hover {
          background: #dbeafe;
        }

        /* Cards Layout */
        .welcome-card, .scripture-card {
          background: var(--bg-card);
          border-radius: var(--radius-card);
          padding: 22px;
          margin: 16px;
          box-shadow: var(--shadow-subtle);
          border: 1px solid var(--border-light);
        }

        .welcome-card span {
          font-size: 0.8rem;
          color: var(--primary-color);
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .welcome-card h2 {
          font-size: 1.4rem;
          color: var(--text-main);
          margin: 6px 0 4px 0;
        }

        .welcome-card p {
          color: var(--text-muted);
          font-size: 0.95rem;
          margin: 0;
        }

        .scripture-header {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 0.85rem;
          color: var(--primary-color);
          font-weight: 600;
          margin-bottom: 10px;
        }

        .scripture-card p {
          font-size: 1.05rem;
          line-height: 1.5;
          color: var(--text-main);
          margin: 0;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: var(--bg-card);
          display: flex;
          justify-content: space-around;
          padding: 10px 0 14px 0;
          border-top: 1px solid var(--border-light);
          z-index: 1000;
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-decoration: none;
          color: var(--text-muted);
          font-size: 0.75rem;
          font-weight: 500;
          gap: 4px;
          transition: color 0.2s;
        }

        .nav-item svg {
          width: 22px;
          height: 22px;
          stroke: var(--text-muted);
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .nav-item.active {
          color: var(--primary-color);
        }

        .nav-item.active svg {
          stroke: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header with New Logo -->
        <header class="brand-header">
            <div class="brand-info">
                <img src="assets/river-logo.png" alt="River of Life Logo" class="brand-logo">
                <div class="brand-title">
                    <h1>River of Life</h1>
                    <p>जीवन नदी बायबल</p>
                </div>
            </div>
            <div class="brand-actions">
                <button class="icon-btn" aria-label="Notifications">🔔</button>
            </div>
        </header>

        <!-- Welcome Greeting -->
        <section class="welcome-card">
            <span>Welcome Back</span>
            <h2>शुभ सकाळ, गौरव 👋</h2>
            <p>Keep walking in His grace today.</p>
        </section>

        <!-- Daily Scripture Card -->
        <section class="scripture-card">
            <div class="scripture-header">
                <span>📖 Today's Scripture • आजचे वचन</span>
            </div>
            <p>"तुझे वचन माझ्या पायास दिवा व माझ्या मार्गावर प्रकाश आहे." - स्तोत्र १११:१०</p>
        </section>
    </div>

    <!-- Sleek Bottom Navigation Menu -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Bible</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Daily</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </nav>

</body>
</html>
