<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River of Life - जीवन नदी बायबल</title>
    <style>
        :root {
          --primary-color: #2563eb;     /* Vibrant, inspiring royal blue */
          --primary-light: #eff6ff;     /* Soft icy blue tint */
          --accent-gold: #d97706;       /* Warm amber/gold accent */
          --text-main: #1e293b;         /* Deep charcoal for crisp reading */
          --text-muted: #64748b;        /* Soft slate gray for subtext */
          --bg-app: #f8fafc;            /* Clean light background canvas */
          --bg-card: #ffffff;           /* Pure white for cards */
          --border-light: #e2e8f0;      /* Subtle border line */
          --shadow-subtle: 0 4px 20px rgba(37, 99, 235, 0.05);
          --radius-card: 16px;
        }

        body {
          background-color: var(--bg-app);
          color: var(--text-main);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          margin: 0;
          padding: 0;
          padding-bottom: 90px; /* Space for bottom navigation */
        }

        .app-container {
          max-width: 600px;
          margin: 0 auto;
        }

        /* Header Styles */
        .brand-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 20px;
          background: var(--bg-card);
          border-bottom: 1px solid var(--border-light);
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .brand-info {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .brand-logo {
          width: 42px;
          height: 42px;
          object-fit: contain;
          border-radius: 10px;
          background: var(--primary-light);
          padding: 4px;
        }

        .brand-title h1 {
          font-size: 1.1rem;
          font-weight: 700;
          margin: 0;
          color: var(--text-main);
        }

        .brand-title p {
          font-size: 0.8rem;
          color: var(--text-muted);
          margin: 0;
        }

        .icon-btn {
          background: var(--primary-light);
          border: none;
          width: 38px;
          height: 38px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--primary-color);
          transition: background 0.2s;
        }

        .icon-btn:hover {
          background: #dbeafe;
        }

        /* Cards Layout & Overrides */
        .welcome-card, .scripture-card, .vod-display-card, .welcome-header-card, .home-action-card {
          background: var(--bg-card) !important;
          border-radius: var(--radius-card);
          padding: 22px;
          margin: 16px;
          box-shadow: var(--shadow-subtle);
          border: 1px solid var(--border-light);
          color: var(--text-main) !important;
        }

        .welcome-card span, .welcome-header-card .date-label {
          font-size: 0.8rem;
          color: var(--primary-color);
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .welcome-card h2, .greeting-text {
          font-size: 1.4rem;
          color: var(--text-main) !important;
          margin: 6px 0 4px 0;
        }

        .welcome-card p, .welcome-header-card p {
          color: var(--text-muted) !important;
          font-size: 0.95rem;
          margin: 0;
        }

        .scripture-header {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 0.85rem;
          color: var(--primary-color);
          font-weight: 600;
          margin-bottom: 10px;
        }

        .scripture-card p, .vod-text {
          font-size: 1.05rem;
          line-height: 1.5;
          color: var(--text-main) !important;
          margin: 0;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: var(--bg-card);
          display: flex;
          justify-content: space-around;
          padding: 10px 0 14px 0;
          border-top: 1px solid var(--border-light);
          z-index: 1000;
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-decoration: none;
          color: var(--text-muted);
          font-size: 0.75rem;
          font-weight: 500;
          gap: 4px;
          transition: color 0.2s;
        }

        .nav-item svg {
          width: 22px;
          height: 22px;
          stroke: var(--text-muted);
          fill: none;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .nav-item.active {
          color: var(--primary-color);
        }

        .nav-item.active svg {
          stroke: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Brand Header -->
        <header class="brand-header">
            <div class="brand-info">
                <img src="assets/icons/river-logo.png" alt="Logo" class="brand-logo">
                <div class="brand-title">
                    <h1>River of Life</h1>
                    <p>जीवन नदी बायबल</p>
                </div>
            </div>
            <button aria-label="Profile" class="icon-btn">👤</button>
        </header>

        <!-- Main Dynamic App Shell -->
        <div id="app">
            <section class="welcome-card">
                <span>Welcome Back</span>
                <h2>Good morning, Friend</h2>
                <p>Walk with God today.</p>
            </section>

            <section class="scripture-card">
                <div class="scripture-header">✦ VERSE OF THE DAY</div>
                <p>“The LORD is my shepherd; I shall not want.”</p>
                <div style="margin-top: 12px; font-weight: 600; color: var(--text-muted);">— Psalm 23:1</div>
            </section>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="#/home" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="#/bible" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Bible</span>
            </a>
            <a href="#/meetings" class="nav-item">
                <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                <span>Meetings</span>
            </a>
            <a href="#/plans" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Plans</span>
            </a>
            <a href="#/prayers" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span>Prayers</span>
            </a>
            <a href="#/profile" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>You</span>
            </a>
        </nav>
    </div>

</body>
</html>
